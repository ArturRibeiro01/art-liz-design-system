name: Publish beta packages

on:
  push:
    branches:
      - develop
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-release-artifacts.mjs'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: npm-beta
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Check for pending changesets
        id: changesets
        shell: bash
        run: |
          COUNT=$(
            node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'

          const packageReleasePattern =
            /^\s*['"]?@art-liz\/(?:tokens|react|create-app)['"]?\s*:\s*(?:patch|minor|major)\s*$/

          let count = 0

          for (const entry of readdirSync('.changeset', { withFileTypes: true })) {
            if (!entry.isFile() || !entry.name.endsWith('.md') || entry.name.toLowerCase() === 'readme.md') {
              continue
            }

            const contents = readFileSync(`.changeset/${entry.name}`, 'utf8')
            const frontmatter = contents.match(/^---\r?\n([\s\S]*?)\r?\n---/)

            if (!frontmatter) {
              continue
            }

            if (frontmatter[1].split(/\r?\n/).some((line) => packageReleasePattern.test(line))) {
              count += 1
            }
          }

          console.log(count)
          NODE
          )

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Pending release changesets found: $COUNT"
          else
            echo "No pending changesets. Beta publication will be skipped."
          fi

      - name: Create beta snapshot versions
        if: steps.changesets.outputs.count != '0'
        run: npx changeset version --snapshot beta

      - name: Test, build, and validate package tarballs
        if: steps.changesets.outputs.count != '0'
        run: npm run ci

      - name: Publish beta dist-tag
        if: steps.changesets.outputs.count != '0'
        run: npx changeset publish --tag beta --no-git-tag
