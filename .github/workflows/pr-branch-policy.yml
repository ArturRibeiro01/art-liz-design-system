name: PR branch policy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  allowed-source:
    name: Allowed source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce source branch for production
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "develop" ]]; then
            echo "Pull requests to main must come from develop; got '$HEAD_REF'." >&2
            exit 1
          fi

          echo "Source '$HEAD_REF' is allowed for target '$BASE_REF'."