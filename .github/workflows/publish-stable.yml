name: Publish stable packages

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-release-artifacts.mjs'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Test, build, and validate package tarballs
        run: npm run ci

      - name: Publish unpublished stable versions
        run: npx changeset publish --no-git-tag

      - name: Promote current package versions to latest
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES=(
            "packages/tokens"
            "packages/react"
            "packages/create-app"
          )

          for PACKAGE_DIR in "${PACKAGES[@]}"; do
            NAME=$(node -p "require('./${PACKAGE_DIR}/package.json').name")
            VERSION=$(node -p "require('./${PACKAGE_DIR}/package.json').version")

            echo "Checking ${NAME}@${VERSION}..."

            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} exists. Promoting it to latest..."
              npm dist-tag add "${NAME}@${VERSION}" latest
            else
              echo "ERROR: ${NAME}@${VERSION} was not found after publish."
              exit 1
            fi
          done
